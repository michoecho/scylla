# The Cargo workspace Reindeer buckifies into this directory's BUCK file.
#
# It is a "pseudo package" in the sense reindeer's manual uses the term: it is
# never built, and no rules are generated for it. Its only job is to name, in
# `[dependencies]`, the crates that should get a public Buck target. Reindeer
# treats the first-order dependencies of a workspace member as the public set,
# so listing the local crate here is what turns it into
# `rust_third_party//:libafl-c` rather than a package-private rule nothing
# outside this file could reference.
[package]
name = "rust-third-party"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# Deliberately empty. Cargo insists a package have a target; nothing compiles
# it, on either the Cargo or the Buck side.
name = "rust_third_party"
path = "pseudo.rs"

[dependencies]
# Local crate, vendored in this directory. `include_workspace_members` in
# reindeer.toml is what makes reindeer emit rules for it; naming it here is
# what makes those rules public.
libafl-c = { path = "libafl-c" }

[workspace]
members = [
    "libafl-c",
]
resolver = "2"

[profile.release]
# Keep release backtraces useful for the LibAFL wrapper and its dependencies.
debug = true
